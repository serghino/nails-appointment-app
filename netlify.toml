[build]
  command = "npm run build"
  publish = "dist/nails-appointment-app/browser"

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "NODE_ENV,PORT,ADMIN_EMAIL,GMAIL_USER"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Route all /api/* requests to the Express Netlify Function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[plugins]]
  package = "@netlify/angular-runtime"
